name: Update results

# Every 3 hours: pick up final scores of matches that should be over. Uses no odds credits and
# only a few football-data.org requests. (The site also refreshes itself when visited, but the
# free football-data.org plan can lag, so this catches up in the background.)
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m scripts.update_results
