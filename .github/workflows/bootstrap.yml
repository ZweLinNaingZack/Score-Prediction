name: First-time setup

# Run once by hand (Actions > First-time setup > Run workflow) after the Neon database exists:
# loads past seasons so the model has something to learn from, then trains and predicts.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Load past seasons (the free plan allows 2023 onwards, about 3 minutes)
        run: python -m scripts.backfill 2023 2024 2025 2026
      - name: Train the model
        run: python -m app.ml.train
      - name: Predict upcoming matches
        run: python -m scripts.fetch_and_predict
      - name: Market odds
        run: python -m scripts.update_odds
